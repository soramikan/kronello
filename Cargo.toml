[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soramikan/kronello"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Large pinned fonts/assets must still be hashed in debug builds. In particular,
# sha2 uses its portable implementation on aarch64 without the asm feature.
[profile.dev.package.sha2]
opt-level = 3
