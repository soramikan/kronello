[package]
name = "kronello-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Plugin code is loaded only inside the detached helper process. Unsafe is
# confined to the audited abi module, mirroring kronello-media's ffi module.
[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
sha2 = "0.10"
thiserror = "2"
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kronello-plugin-host"
path = "src/bin/host.rs"
