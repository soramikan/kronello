[package]
name = "kronello-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kronello-service = { path = "../kronello-service" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "signal", "time"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
kronello-service = { path = "../kronello-service", features = ["test-adapter-unavailable", "test-job-control"] }
kronello-jobs = { path = "../kronello-jobs", features = ["test-support"] }
jsonschema = { version = "0.46", default-features = false }
tempfile = "3"
