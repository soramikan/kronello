[package]
name = "kronello-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kronello-render = { path = "../kronello-render" }
kronello-model = { path = "../kronello-model" }
wgpu = "30.0.1"
pollster = "1.0.1"
half = "2.7"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
kronello-time = { path = "../kronello-time" }
kronello-testkit = { path = "../kronello-testkit" }
serde_json = "1"
png = "0.18"
naga = { version = "30.0.1", features = ["wgsl-in"] }
kronello-vector = { path = "../kronello-vector" }
kronello-text = { path = "../kronello-text" }
