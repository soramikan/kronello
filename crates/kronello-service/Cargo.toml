[package]
name = "kronello-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fault injection for CLI integration tests; also requires debug assertions.
test-adapter-unavailable = []
# Process integration checkpoints and corrupt-output validation injection.
test-job-control = []

[dependencies]
kronello-jobs = { path = "../kronello-jobs" }
kronello-audio = { path = "../kronello-audio" }
schemars = { version = "1", features = ["uuid1"] }
kronello-eval = { path = "../kronello-eval" }
kronello-template = { path = "../kronello-template" }
kronello-media = { path = "../kronello-media" }
kronello-model = { path = "../kronello-model" }
kronello-time = { path = "../kronello-time" }
kronello-store = { path = "../kronello-store" }
kronello-render = { path = "../kronello-render" }
kronello-tracking = { path = "../kronello-tracking" }
kronello-scene = { path = "../kronello-scene" }
kronello-gpu = { path = "../kronello-gpu" }
kronello-framebridge = { path = "../kronello-framebridge" }
kronello-vector = { path = "../kronello-vector" }
kronello-text = { path = "../kronello-text" }
kronello-plugin = { path = "../kronello-plugin" }
xml-rs = "=0.8.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
png = "0.18"
kronello-testkit = { path = "../kronello-testkit" }
kronello-plugin = { path = "../kronello-plugin", features = ["test-support"] }
jsonschema = { version = "0.46", default-features = false }
