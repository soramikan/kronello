[package]
name = "kronello-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-adapter-unavailable = ["kronello-service/test-adapter-unavailable"]

[[bin]]
name = "kronello"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "signal"] }
kronello-service = { path = "../kronello-service" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
kronello-audio = { path = "../kronello-audio" }
kronello-media = { path = "../kronello-media" }
kronello-service = { path = "../kronello-service", features = ["test-adapter-unavailable", "test-job-control"] }
kronello-jobs = { path = "../kronello-jobs", features = ["test-support"] }
kronello-platform = { path = "../kronello-platform" }
rusqlite = { version = "0.38", features = ["bundled"] }
nix = { version = "0.31", features = ["process", "signal"] }
kronello-model = { path = "../kronello-model" }
kronello-render = { path = "../kronello-render" }
kronello-time = { path = "../kronello-time" }
kronello-testkit = { path = "../kronello-testkit" }
tempfile = "3"
sha2 = "0.10"
png = "0.18"
kronello-store = { path = "../kronello-store" }
jsonschema = { version = "0.46", default-features = false }
