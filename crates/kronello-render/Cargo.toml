[package]
name = "kronello-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schemars = { version = "1", features = ["uuid1"] }
kronello-template = { path = "../kronello-template" }
kronello-model = { path = "../kronello-model" }
kronello-time = { path = "../kronello-time" }
kronello-eval = { path = "../kronello-eval" }
kronello-vector = { path = "../kronello-vector" }
kronello-text = { path = "../kronello-text" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Raw numeric output is IEEE binary16, independent of the concrete backend.
half = "2.7"
png = "0.18"
tempfile = "3"

[dev-dependencies]
kronello-gpu = { path = "../kronello-gpu" }
kronello-testkit = { path = "../kronello-testkit" }
