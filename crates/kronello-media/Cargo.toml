[package]
name = "kronello-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Mirror workspace lints; unsafe is confined to the audited ffi module.
[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"

[dependencies]
kronello-audio = { path = "../kronello-audio" }
kronello-text = { path = "../kronello-text" }
schemars = "1"
kronello-model = { path = "../kronello-model" }
kronello-time = { path = "../kronello-time" }
kronello-render = { path = "../kronello-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
kronello-gpu = { path = "../kronello-gpu" }
uuid = { version = "1", features = ["v4"] }
