[package]
name = "kronello-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-worker = ["test-support"]
test-support = ["kronello-platform/test-support"]

[[bin]]
name = "kronello-job-test-worker"
path = "src/test_worker.rs"
required-features = ["test-worker"]

[dependencies]
kronello-platform = { path = "../kronello-platform" }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
directories = "6"
thiserror = "2"
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
