[package]
name = "kronello-framebridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cargo cannot inherit a lint table and override one entry. Mirror the workspace
# tables here, relaxing only unsafe_code for the audited native interop module.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"

[dependencies]
kronello-gpu = { path = "../kronello-gpu" }
wgpu = "30.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-metal", "objc2-io-surface"] }
objc2-core-media = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }

[dev-dependencies]
kronello-testkit = { path = "../kronello-testkit" }
