[package]
name = "kronello-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# ADR-0074: mirror workspace lints (checked by scripts/job_evidence.py).
# Keep this table in sync; only the Windows native module allows unsafe.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[features]
test-support = []

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console"] }
