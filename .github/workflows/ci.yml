name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "3"

jobs:
  windows-store:
    name: Windows (full CLI/MCP and LGPL media)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build hash-pinned LGPL runtime with MinGW
        shell: pwsh
        run: |
          $env:MSYSTEM = "MINGW64"
          $env:CHERE_INVOKING = "1"
          $env:KRONELLO_MSYS2_BASH = "C:/msys64/usr/bin/bash.exe"
          & C:/msys64/usr/bin/bash.exe -lc 'pacman --noconfirm -S --needed mingw-w64-x86_64-toolchain mingw-w64-x86_64-python mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-meson mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm make && python scripts/build_ffmpeg_lgpl.py --jobs 3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KRONELLO_FFMPEG_PREFIX=$env:GITHUB_WORKSPACE/target/native/ffmpeg-lgpl" >> $env:GITHUB_ENV
          "KRONELLO_FFMPEG_LIB_DIR=$env:GITHUB_WORKSPACE/target/native/ffmpeg-lgpl/bin" >> $env:GITHUB_ENV
      - name: Build full CLI and MCP with the pinned runtime headers
        run: cargo build -p kronello-cli -p kronello-mcp --all-targets --locked
      - name: Execute real media roundtrip and CLI/MCP parent-exit evidence
        run: python scripts/media_003_evidence.py
      - name: Upload MEDIA-003 evidence and native receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-003-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/media-003-evidence
            target/native/ffmpeg-lgpl/build-receipt.json
          if-no-files-found: error
      - name: Test storage and operational example
        run: cargo test -p kronello-store --all-targets --locked
      - name: Verify jobs/platform real processes and record evidence
        if: always()
        run: python scripts/job_evidence.py
      - name: Upload JOB-002 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-002-${{ runner.os }}-${{ runner.arch }}
          path: target/job-002-evidence
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    # Allow cold builds plus the full Rust, Swift, SDK and process verification.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version --verbose
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Clear restored verification evidence
        run: rm -rf -- target/mcp-003-evidence target/ffi-002-evidence target/job-002-evidence
      - name: Install FFmpeg development dependencies
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fetch hash-pinned test fixtures
        run: python3 scripts/fetch_fixtures.py
      - name: Generate and validate fixtures
        run: |
          python3 scripts/fixtures.py generate
          python3 scripts/fixtures.py check --generated target/fixtures/generated
          python3 -m unittest discover -s scripts/tests -v
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Verify job real processes and record evidence
        id: verify_jobs
        if: always()
        run: python3 scripts/job_evidence.py
      - name: Upload JOB-002 evidence
        if: always() && (steps.verify_jobs.outcome == 'success' || steps.verify_jobs.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-002-${{ runner.os }}-${{ runner.arch }}
          path: target/job-002-evidence
          if-no-files-found: error
      - name: Run small CPU integration test
        env:
          KRONELLO_INTEGRATION_TESTS: "1"
        run: |
          cargo build -p kronello-cli -p kronello-mcp --locked
          python3 -m unittest scripts.tests.test_integration_m2.IntegrationM2.test_small_cpu_reference -v
      - name: Build and test the macOS FFI package
        env:
          CARGO_BUILD_JOBS: "3"
          KRONELLO_STATE_ROOT: ${{ runner.temp }}/kronello-swift-state
        run: |
          python3 scripts/build_ffi.py
          swift build --package-path apps/macos -j 3
          swift test --package-path apps/macos -j 3
      - name: Verify MCP 2026 with the official pinned v2 SDK
        id: verify_mcp
        run: |
          cargo build -p kronello-mcp --locked
          python3 -m venv target/mcp-003-sdk
          target/mcp-003-sdk/bin/python -m pip install -r scripts/mcp-003-client-requirements.txt
          target/mcp-003-sdk/bin/python scripts/mcp_003_client_check.py
      - name: Upload MCP-003 SDK evidence
        if: always() && (steps.verify_mcp.outcome == 'success' || steps.verify_mcp.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-003-${{ runner.os }}-${{ runner.arch }}
          path: target/mcp-003-evidence
          if-no-files-found: error
      - name: Verify native safe-session close and process termination
        id: verify_ffi
        run: |
          cargo build -p kronello-ffi -p kronello-cli -p kronello-mcp --locked
          python3 scripts/ffi_002_evidence.py
      - name: Upload FFI-002 real process evidence
        if: always() && (steps.verify_ffi.outcome == 'success' || steps.verify_ffi.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffi-002-${{ runner.os }}-${{ runner.arch }}
          path: target/ffi-002-evidence
          if-no-files-found: error
      - name: Validate backlog
        run: python3 scripts/backlog.py check
      - name: Validate design system preview
        run: python3 scripts/design_preview.py check

  linux-software-vulkan:
    name: Linux (Mesa lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      # Keep duplicate dev/test/feature artifacts below the hosted disk budget.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install and select Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print)"
          test -f "$lavapipe_icd"
          export VK_DRIVER_FILES="$lavapipe_icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/kronello-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          printf 'VK_DRIVER_FILES=%s\n' "$VK_DRIVER_FILES" >> "$GITHUB_ENV"
          printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          vulkaninfo --summary | tee "$RUNNER_TEMP/kronello-vulkan-summary.txt"
          grep -Eq 'deviceType[[:space:]]*=[[:space:]]*PHYSICAL_DEVICE_TYPE_CPU' "$RUNNER_TEMP/kronello-vulkan-summary.txt"
          grep -Eq 'driverName[[:space:]]*=[[:space:]]*(llvmpipe|lavapipe)' "$RUNNER_TEMP/kronello-vulkan-summary.txt"
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version --verbose
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lean-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Clear restored verification evidence
        run: rm -rf -- target/mcp-003-evidence target/ffi-002-evidence target/job-002-evidence
      - name: Report disk available for workspace tests
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Install FFmpeg development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev ffmpeg
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fetch hash-pinned test fixtures
        run: python3 scripts/fetch_fixtures.py
      - name: Generate and validate fixtures
        run: |
          python3 scripts/fixtures.py generate
          python3 scripts/fixtures.py check --generated target/fixtures/generated
          python3 -m unittest discover -s scripts/tests -v
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Verify job real processes and record evidence
        id: verify_jobs
        if: always()
        run: python3 scripts/job_evidence.py
      - name: Upload JOB-002 evidence
        if: always() && (steps.verify_jobs.outcome == 'success' || steps.verify_jobs.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-002-${{ runner.os }}-${{ runner.arch }}
          path: target/job-002-evidence
          if-no-files-found: error
      - name: Run small CPU integration test
        env:
          KRONELLO_INTEGRATION_TESTS: "1"
        run: |
          cargo build -p kronello-cli -p kronello-mcp --locked
          python3 -m unittest scripts.tests.test_integration_m2.IntegrationM2.test_small_cpu_reference -v
      - name: Verify MCP 2026 with the official pinned v2 SDK
        id: verify_mcp
        run: |
          cargo build -p kronello-mcp --locked
          python3 -m venv target/mcp-003-sdk
          target/mcp-003-sdk/bin/python -m pip install -r scripts/mcp-003-client-requirements.txt
          target/mcp-003-sdk/bin/python scripts/mcp_003_client_check.py
      - name: Upload MCP-003 SDK evidence
        if: always() && (steps.verify_mcp.outcome == 'success' || steps.verify_mcp.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-003-${{ runner.os }}-${{ runner.arch }}
          path: target/mcp-003-evidence
          if-no-files-found: error
      - name: Verify native safe-session close and process termination
        id: verify_ffi
        run: |
          cargo build -p kronello-ffi -p kronello-cli -p kronello-mcp --locked
          python3 scripts/ffi_002_evidence.py
      - name: Upload FFI-002 real process evidence
        if: always() && (steps.verify_ffi.outcome == 'success' || steps.verify_ffi.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffi-002-${{ runner.os }}-${{ runner.arch }}
          path: target/ffi-002-evidence
          if-no-files-found: error
      - name: Validate backlog
        run: python3 scripts/backlog.py check

  qa004-platform-golden:
    name: QA-004 ${{ matrix.profile }} (actual adapter)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            profile: linux-vulkan
            backend: vulkan
          - runner: windows-latest
            profile: windows-dx12
            backend: dx12
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      KRONELLO_GOLDEN: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Select actual Linux software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools
          driver="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print)"
          test -f "$driver"
          printf 'VK_DRIVER_FILES=%s\n' "$driver" >> "$GITHUB_ENV"
          printf 'XDG_RUNTIME_DIR=%s\n' "$RUNNER_TEMP/kronello-qa004-xdg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/kronello-qa004-xdg"
          chmod 700 "$RUNNER_TEMP/kronello-qa004-xdg"
      - name: Install pinned Rust and input fixtures
        run: |
          rustup show
          python scripts/fetch_fixtures.py
      - name: Generate candidate with CPU oracle (does not adopt)
        env:
          KRONELLO_GOLDEN_UPDATE: "1"
        run: |
          export KRONELLO_GOLDEN_OUTPUT="$GITHUB_WORKSPACE/target/golden/run.qa004.candidate"
          cargo test -p kronello-gpu --test golden --locked -- --ignored --nocapture
      - name: Compare reviewed platform baseline
        run: |
          export KRONELLO_GOLDEN_OUTPUT="$GITHUB_WORKSPACE/target/golden/run.qa004.compare"
          cargo test -p kronello-gpu --test golden --locked -- --ignored --nocapture
      - name: Upload candidate, actual adapter provenance and comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa004-${{ matrix.profile }}
          path: target/golden
          if-no-files-found: error
